<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt Modal</title>
  <style>
    * { box-sizing: border-box; min-width: 0; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      overflow-x: hidden;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      backdrop-filter: blur(6px);
      background: rgba(15, 23, 42, 0.08);
      animation: fadeIn 0.16s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      width: auto;
      max-width: 100%;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      animation: popIn 180ms ease-out;
    }

    @keyframes popIn {
      from {
        opacity: .9;
        transform: translateY(6px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .titleWrap {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .modalTitle {
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    .orderIdBig {
      font-size: 30px;
      font-weight: 800;
      color: #2563eb;
      word-break: break-word;
    }

    .modalSub {
      color: #6b7280;
      font-size: 12px;
    }

    .viewer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
    }

    .paperFrame {
      width: min(420px, 100%);
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .paper {
      position: relative;
      overflow: hidden;
    }

    .receipt {
      background: #f9fafb;
      color: #111827;
      padding: 18px 16px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Courier New",
        monospace;
      font-size: 12px;
      line-height: 1.4;
      transform-origin: top center;
      overflow-x: hidden;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .ready .receipt {
      transform: translateY(0);
    }

    .printing .receipt {
      animation: feedOut 1.1s cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes feedOut {
      0% { transform: translateY(-48%) scaleY(.97); }
      55% { transform: translateY(-8%) scaleY(1); }
      100% { transform: translateY(0); }
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0),
        rgba(0,0,0,0.08),
        rgba(0,0,0,0)
      );
      transform: translateY(-120%);
    }

    .printing .scanline {
      opacity: 1;
      animation: scan 1.05s linear infinite;
    }

    @keyframes scan {
      from { transform: translateY(-120%); }
      to { transform: translateY(120%); }
    }

    .receiptHeader {
      margin-bottom: 10px;
      text-align: center;
    }

    .logo {
      display: block;
      max-width: 110px;
      max-height: 38px;
      object-fit: contain;
      margin: 0 auto 8px;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
    }

    .subtle {
      color: #6b7280;
      font-size: 11px;
    }

    .hr {
      height: 1px;
      margin: 10px 0;
      background: #d1d5db;
    }

    .hrDashed {
      height: 1px;
      margin: 10px 0;
      background: repeating-linear-gradient(
        90deg,
        #9ca3af 0 8px,
        transparent 8px 12px
      );
    }

    .metaGrid {
      display: grid;
      gap: 6px;
    }

    .metaRow {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .metaKey {
      color: #6b7280;
    }

    .metaVal {
      color: #111827;
      text-align: right;
      word-break: break-word;
    }

    .itemsHeader,
    .itemRow {
      display: grid;
      grid-template-columns: minmax(0,1fr) 48px 82px 92px;
      gap: 8px;
      width: 100%;
    }

    .itemsHeader {
      font-weight: 800;
    }

    .items {
      display: grid;
      gap: 8px;
    }

    .itemName {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .right {
      text-align: right;
    }

    .mono {
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 10px 0;
      color: #6b7280;
    }

    .totalRow {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
      margin-top: 2px;
    }

    .totalLabel {
      font-size: 13px;
    }

    .totalValue {
      font-size: 15px;
      text-align: right;
    }

    .notes {
      margin-top: 8px;
      word-break: break-word;
    }

    .notesTitle {
      margin-bottom: 4px;
      font-weight: 800;
    }

    .footer {
      margin-top: 14px;
    }

    .center {
      text-align: center;
      font-weight: 800;
    }

    .centerSmall {
      margin-top: 4px;
      text-align: center;
      color: #6b7280;
      font-size: 11px;
    }

    .statusBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
      max-width: 100%;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .countdown {
      letter-spacing: 0.5px;
      font-family: monospace;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      border-radius: 8px;
      padding: 6px 12px;
      margin: 0;
    }

    .normal {
      background: #eef2ff;
      color: #3730a3;
    }

    .warning {
      background: #fff7ed;
      color: #c2410c;
    }

    .urgent {
      background: #bbf7d0;
      color: #166534;
      animation: pulse 1s infinite;
    }

    .statusDefault { background: #e5e7eb; color: #111827; }
    .statusPENDING { background: #fde68a; color: #78350f; }
    .statusCONFIRMED { background: #ddd6fe; color: #5b21b6; }
    .statusPREPARING { background: #bfdbfe; color: #1d4ed8; }
    .statusREADY { background: #bbf7d0; color: #166534; }
    .statusCOMPLETED { background: #a7f3d0; color: #065f46; }
    .statusCANCELLED,
    .statusREJECTED { background: #fecaca; color: #991b1b; }

    @media (max-width: 600px) {
      body { overflow-x: hidden; }

      .backdrop { padding: 0; }

      .modal {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }

      .topBar { padding: 16px 14px; }

      .orderIdBig { font-size: 24px; }

      .viewer { padding: 12px; }

      .paperFrame {
        width: 100%;
        max-width: 100%;
      }

      .receipt {
        padding: 14px 12px;
        font-size: 11px;
      }

      .itemsHeader,
      .itemRow {
        grid-template-columns: minmax(0,1fr) 38px 58px 68px;
        gap: 4px;
      }

      .statusBadge { min-width: unset; }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="backdrop" role="dialog" aria-modal="true" aria-label="Receipt Modal">
    <div class="modal">
      <div class="topBar">
        <div class="titleWrap">
          <div class="modalTitle">Receipt</div>
          <div class="orderIdBig" id="orderIdBig">#—</div>
          <div class="modalSub" id="modalSub">Receipt details and summary.</div>
        </div>
        <div id="countdownWrap" style="display:none;">
          <p id="countdown" class="countdown normal"></p>
        </div>
      </div>

      <div class="viewer">
        <div id="paperFrame" class="paperFrame ready">
          <div class="paperTop"></div>

          <div class="paper">
            <div class="scanline"></div>

            <div class="receipt" aria-label="Receipt">
              <header class="receiptHeader">
                <img id="logo" class="logo" src="" alt="Business logo" />
                <div class="brand" id="brand"></div>
                <div class="subtle" id="businessAddress"></div>
                <div class="subtle" id="businessPhone"></div>
              </header>

              <div class="hr"></div>

              <section class="metaGrid">
                <div class="metaRow">
                  <span class="metaKey">ORDER</span>
                  <span class="metaVal mono" id="metaOrder"></span>
                </div>

                <div class="metaRow">
                  <span class="metaKey">BUSINESS ID</span>
                  <span class="metaVal mono" id="metaBusinessId"></span>
                </div>

                <div class="metaRow">
                  <span class="metaKey">STATUS</span>
                  <span class="metaVal statusBadge statusDefault" id="metaStatus"></span>
                </div>

                <div class="metaRow">
                  <span class="metaKey">CREATED</span>
                  <span class="metaVal" id="metaCreated"></span>
                </div>

                <div class="metaRow">
                  <span class="metaKey">UPDATED</span>
                  <span class="metaVal" id="metaUpdated"></span>
                </div>
              </section>

              <div class="hrDashed"></div>

              <section>
                <div class="itemsHeader">
                  <span>ITEM</span>
                  <span class="right">QTY</span>
                  <span class="right">PRICE</span>
                  <span class="right">TOTAL</span>
                </div>

                <div class="hr"></div>

                <div class="items" id="items"></div>
                <div class="empty" id="emptyItems" style="display:none;">No line items available</div>
              </section>

              <div class="hrDashed"></div>

              <div class="totalRow">
                <span class="totalLabel">TOTAL</span>
                <span class="totalValue mono" id="totalValue"></span>
              </div>

              <div class="metaRow">
                <span class="metaKey">Tax / VAT (25%)</span>
                <span class="metaVal" id="taxValue"></span>
              </div>

              <div class="hrDashed"></div>

              <section class="metaGrid">
                <div class="itemsHeader">
                  <span>PAYMENT</span>
                </div>

                <div class="metaRow">
                  <span class="metaKey">PaymentId</span>
                  <span class="metaVal" id="paymentId"></span>
                </div>
                <div class="metaRow">
                  <span class="metaKey">CustomerId</span>
                  <span class="metaVal" id="customerId"></span>
                </div>
              </section>

              <div id="notesBlock" style="display:none;">
                <div class="hr"></div>
                <section class="notes">
                  <div class="notesTitle">NOTES</div>
                  <div class="subtle" id="notes"></div>
                </section>
              </div>

              <footer class="footer">
                <div class="center">Powered by</div>
                <div class="centerSmall">Taply</div>
              </footer>
            </div>
          </div>

          <div class="paperBottom"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const order = __ORDER_JSON__;

    const autoPrint = true;
    const printDurationMs = 1400;

    function formatMoney(amount, currency = "USD") {
      const value = Number(amount);
      if (!Number.isFinite(value)) return "—";
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency,
          maximumFractionDigits: 2,
        }).format(value);
      } catch {
        return `${value.toFixed(2)} ${currency || ""}`.trim();
      }
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "—";
      return new Intl.DateTimeFormat(undefined, {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d);
    }

    function normalizeItems(order) {
      const possibleItems =
        order?.data?.items ??
        order?.items ??
        (Array.isArray(order?.data) ? order.data : []);

      if (!Array.isArray(possibleItems)) return [];

      return possibleItems.map((item, index) => {
        const qty = Number(item?.qty ?? item?.quantity ?? 1);
        const price = Number(item?.price ?? item?.data?.[0]?.price ?? 0);
        const total =
          item?.total != null
            ? Number(item.total)
            : Number.isFinite(qty) && Number.isFinite(price)
            ? qty * price
            : null;
        const subName = item?.data?.[0]?.name || "";
        return {
          id: item?.id ?? `${index}-${item?.name ?? item?.title ?? "item"}`,
          name: item?.name ?? item?.title ?? `Item ${index + 1}`,
          subName,
          qty: Number.isFinite(qty) && qty > 0 ? qty : 1,
          price: Number.isFinite(price) ? price : null,
          total: Number.isFinite(total) ? total : null,
        };
      });
    }

    function formatCountdown(ms) {
      if (ms == null) return "—";
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function computeTotal(order, items) {
      if (order?.totalPrice != null && Number.isFinite(Number(order.totalPrice))) {
        return Number(order.totalPrice);
      }
      if (!items.length) return null;
      const sum = items.reduce((acc, item) => acc + (item.total ?? 0), 0);
      return Number.isFinite(sum) ? sum : null;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function renderReceipt(order) {
      const items = normalizeItems(order);
      const currency = order?.currency ?? order?.data?.currency ?? "Kr";
      const computedTotal = computeTotal(order, items);

      const businessName = order?.businessName ?? "Business";
      const businessAddress = order?.businessAddress ?? order?.data?.businessAddress ?? "—";
      const businessPhone = order?.businessPhone ?? order?.data?.businessPhone ?? "—";
      const notes = order?.notes ?? order?.data?.notes ?? "";
      const status = String(order?.status ?? "—").toUpperCase();

      setText("orderIdBig", `#${order?.id ?? "—"}`);
      setText("brand", businessName);
      setText("businessAddress", `ADR: ${businessAddress}`);
      setText("businessPhone", `TEL: ${businessPhone}`);
      setText("metaOrder", `#${order?.id ?? "—"}`);
      setText("metaBusinessId", order?.businessId ?? "—");
      setText("metaCreated", formatDate(order?.createdAt));
      setText("metaUpdated", formatDate(order?.updatedAt));
      setText("totalValue", computedTotal == null ? "—" : formatMoney(computedTotal, currency));
      setText("taxValue", computedTotal == null ? "—" : `${(computedTotal * 0.25).toFixed(2)}${currency}`);
      setText("paymentId", order?.paymentIntentId || "—");

      const customerId = order?.customerId
        ? order.customerId.length > 20
          ? order.customerId.slice(0, 20) + "..."
          : order.customerId
        : "—";
      setText("customerId", customerId);

      const logo = document.getElementById("logo");
      logo.src = order.businessLogo ?? "https://dummyimage.com/110x38/f3f4f6/6b7280.png&text=Logo";
      logo.alt = `${businessName} logo`;

      const statusEl = document.getElementById("metaStatus");
      statusEl.textContent = status;
      statusEl.className = `metaVal statusBadge ${document.querySelector(`.status${status}`) ? `status${status}` : "statusDefault"}`;

      const itemsWrap = document.getElementById("items");
      const emptyEl = document.getElementById("emptyItems");
      itemsWrap.innerHTML = "";

      if (items.length) {
        emptyEl.style.display = "none";
        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "itemRow";
          row.innerHTML = `
            <span class="itemName" title="${escapeHtml(item.name)}">${escapeHtml(
              `${item.name}${item.subName ? ` - ${item.subName}` : ""}`.toLowerCase()
            )}</span>
            <span class="right mono">${item.qty}x</span>
            <span class="right mono">${item.price == null ? "—" : escapeHtml(formatMoney(item.price, currency))}</span>
            <span class="right mono">${item.total == null ? "—" : escapeHtml(formatMoney(item.total, currency))}</span>
          `;
          itemsWrap.appendChild(row);
        });
      } else {
        emptyEl.style.display = "block";
      }

      const notesBlock = document.getElementById("notesBlock");
      if (notes) {
        notesBlock.style.display = "block";
        setText("notes", String(notes));
      } else {
        notesBlock.style.display = "none";
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function startPrinting() {
      if (!autoPrint) return;
      const paperFrame = document.getElementById("paperFrame");
      const modalSub = document.getElementById("modalSub");
      paperFrame.classList.remove("ready");
      paperFrame.classList.add("printing");
      modalSub.textContent = "Printing…";
      setTimeout(() => {
        paperFrame.classList.remove("printing");
        paperFrame.classList.add("ready");
        modalSub.textContent = "Receipt details and summary.";
      }, printDurationMs);
    }

    function startCountdown(order) {
      if (!order?.createdAt || !order?.pickupAt) return;
      if (String(order?.status).toUpperCase() === "READY") return;

      const wrap = document.getElementById("countdownWrap");
      const el = document.getElementById("countdown");
      wrap.style.display = "block";

      const start = new Date(order.createdAt).getTime();
      const end = new Date(order.pickupAt).getTime();

      function updateCountdown() {
        const now = Date.now();
        let timeLeft;

        if (now < start) {
          timeLeft = end - start;
        } else if (now >= end) {
          timeLeft = 0;
        } else {
          timeLeft = end - now;
        }

        el.textContent = timeLeft === 0 && String(order?.status).toUpperCase() === "READY"
          ? "Expected ready"
          : ` Ready in: ${formatCountdown(timeLeft)}`;

        el.className = "countdown " + (
          timeLeft < 60000 ? "urgent" :
          timeLeft < 300000 ? "warning" :
          "normal"
        );
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    }

    renderReceipt(order);
    startPrinting();
    startCountdown(order);

    // To reuse with your own data, replace the `order` object above or set:
    // window.renderCustomReceipt(yourOrderObject)
    window.renderCustomReceipt = function(customOrder) {
      renderReceipt(customOrder);
      startCountdown(customOrder);
    };
  </script>
</body>
</html>
